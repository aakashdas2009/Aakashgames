<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Recoil Racer: STABLE BUILD</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        /* CORE RESET */
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Orbitron', sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; }

        /* UI LAYER */
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; display: flex; flex-direction: column; justify-content: space-between; }

        /* HUD */
        .hud-top { display: flex; justify-content: space-between; padding: 20px; }
        .hud-box {
            background: rgba(0, 20, 40, 0.8);
            border-left: 4px solid #00ffff;
            padding: 10px 20px;
            backdrop-filter: blur(4px);
            transform: skewX(-10deg);
        }
        .label { color: #00aaaa; font-size: 10px; letter-spacing: 2px; font-weight: bold; }
        .value { color: #fff; font-size: 24px; font-weight: 900; text-shadow: 0 0 10px #00ffff; }

        /* CROSSHAIR */
        #crosshair {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 40px; height: 40px; border: 2px solid rgba(255, 255, 255, 0.6); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; transition: transform 0.05s;
        }
        #dot { width: 4px; height: 4px; background: #00ffff; border-radius: 50%; }

        /* MENUS */
        .menu-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 20; pointer-events: auto; transition: opacity 0.3s;
        }
        .hidden { opacity: 0; pointer-events: none !important; }

        h1 {
            font-size: 12vw; margin: 0; color: #fff;
            text-shadow: 4px 4px 0 #00ffff; font-style: italic;
            background: -webkit-linear-gradient(#fff, #00ffff); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        @media (min-width: 600px) { h1 { font-size: 60px; } }

        button {
            margin-top: 30px; padding: 15px 50px;
            background: transparent; border: 2px solid #00ffff; color: #00ffff;
            font-family: 'Orbitron'; font-size: 20px; font-weight: bold;
            cursor: pointer; box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
            clip-path: polygon(10% 0, 100% 0, 100% 70%, 90% 100%, 0 100%, 0 30%);
            transition: 0.2s;
        }
        button:active { background: #00ffff; color: #000; transform: scale(0.95); }

        /* MOBILE CONTROLS */
        #mobile-controls {
            position: absolute; bottom: 20px; width: 100%; height: 160px;
            display: none; justify-content: space-between; padding: 0 30px;
            box-sizing: border-box; pointer-events: auto;
        }

        #joystick-area {
            width: 140px; height: 140px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%; position: relative;
        }
        #joystick-nub {
            width: 60px; height: 60px; background: rgba(0, 255, 255, 0.5);
            border-radius: 50%; position: absolute; top: 40px; left: 40px;
            box-shadow: 0 0 15px #00ffff; pointer-events: none;
        }

        #fire-btn-mobile {
            width: 100px; height: 100px; align-self: center;
            background: rgba(255, 0, 85, 0.2); border: 3px solid #ff0055;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            color: #ff0055; font-weight: bold; font-size: 18px;
            box-shadow: 0 0 15px #ff0055;
        }
        #fire-btn-mobile:active { background: #ff0055; color: #fff; }

        /* PAUSE BTN */
        #pause-btn {
            position: absolute; top: 20px; right: 20px; width: 40px; height: 40px;
            border: 1px solid #fff; color: #fff; display: flex; align-items: center; justify-content: center;
            z-index: 30; pointer-events: auto; background: rgba(0,0,0,0.5); cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="pause-btn">||</div>

    <div id="ui-layer">
        <div class="hud-top">
            <div class="hud-box">
                <div class="label">SCORE</div>
                <div class="value" id="score">0</div>
            </div>
            <div class="hud-box" style="border-left:none; border-right:4px solid #ff0055; text-align:right;">
                <div class="label">VELOCITY</div>
                <div class="value" id="speed">0</div>
            </div>
        </div>
        
        <div id="crosshair"><div id="dot"></div></div>

        <div id="mobile-controls">
            <div id="joystick-area"><div id="joystick-nub"></div></div>
            <div id="fire-btn-mobile">FIRE</div>
        </div>
    </div>

    <div id="menu-start" class="menu-screen">
        <h1>RECOIL RACER</h1>
        <p style="color:#aaa; font-size: 14px; letter-spacing: 2px;">STABLE BUILD v2.4</p>
        <button id="btn-start">INITIALIZE SYSTEM</button>
        <p style="color:#555; font-size: 12px; margin-top: 15px;">PC: MOUSE LOOK | MOBILE: LEFT STICK LOOK</p>
    </div>

    <div id="menu-pause" class="menu-screen hidden">
        <h1 style="font-size: 40px;">PAUSED</h1>
        <button id="btn-resume">RESUME</button>
        <button id="btn-reset" style="border-color: #ff0055; color:#ff0055; margin-top:10px;">REBOOT SYSTEM</button>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';

        // --- 1. ROBUST AUDIO ENGINE ---
        class AudioManager {
            constructor() {
                this.ctx = null;
                this.master = null;
            }

            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                    this.master = this.ctx.createGain();
                    this.master.gain.value = 0.4; // Prevent ear damage
                    this.master.connect(this.ctx.destination);
                }
                if (this.ctx.state === 'suspended') this.ctx.resume();
            }

            playTone(freq, type, duration, vol = 1) {
                if (!this.ctx) return;
                const t = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                
                osc.type = type;
                osc.frequency.setValueAtTime(freq, t);
                
                gain.gain.setValueAtTime(vol, t);
                gain.gain.exponentialRampToValueAtTime(0.01, t + duration);
                
                osc.connect(gain);
                gain.connect(this.master);
                osc.start(t);
                osc.stop(t + duration);
            }

            shoot() { 
                this.playTone(600, 'sawtooth', 0.1, 0.5); 
                // Add a second layer for punch
                this.playTone(100, 'square', 0.1, 0.3);
            }
            hit() { this.playTone(150, 'square', 0.3, 0.6); }
            wall() { this.playTone(50, 'sawtooth', 0.2, 0.4); }
        }

        const audio = new AudioManager();

        // --- 2. GAME VARIABLES ---
        let camera, scene, renderer, composer, controls;
        let bullets = [], enemies = [], particles = [];
        let playerVelocity = new THREE.Vector3();
        let gun, muzzleLight;
        let score = 0;
        let isPaused = true;
        let isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
        
        // Joystick State (The fix for mobile jitter)
        let joyVector = { x: 0, y: 0 };
        const JOYSTICK_SENSITIVITY = 0.035; 
        const JOYSTICK_DEADZONE = 5; // Pixels of movement ignored

        init();
        animate();

        function init() {
            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x020005);
            scene.fog = new THREE.FogExp2(0x020005, 0.003);

            // Camera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 0);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.toneMapping = THREE.ReinhardToneMapping;
            document.body.appendChild(renderer.domElement);

            // Post-Processing (Bloom)
            const renderScene = new RenderPass(scene, camera);
            const bloom = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
            bloom.threshold = 0; bloom.strength = 1.2; bloom.radius = 0.5;
            composer = new EffectComposer(renderer);
            composer.addPass(renderScene);
            composer.addPass(bloom);

            // World
            buildWorld();
            spawnEnemies(8);

            // Lights
            const ambient = new THREE.AmbientLight(0x404040);
            scene.add(ambient);
            const sun = new THREE.DirectionalLight(0xffffff, 0.8);
            sun.position.set(50, 100, 50);
            scene.add(sun);

            // Input System
            setupInputs();

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
                composer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        function buildWorld() {
            // Infinite Floor Illusion
            const grid = new THREE.GridHelper(600, 60, 0x00ffff, 0x111122);
            scene.add(grid);

            // Walls (Electric Fence)
            const wallGeo = new THREE.BoxGeometry(400, 50, 400);
            const wallEdges = new THREE.EdgesGeometry(wallGeo);
            const walls = new THREE.LineSegments(wallEdges, new THREE.LineBasicMaterial({ color: 0xff0055 }));
            walls.position.y = 25;
            scene.add(walls);

            // Gun Model
            gun = new THREE.Group();
            const body = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.2, 0.7), new THREE.MeshStandardMaterial({color:0x333333}));
            const glow = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.05, 0.5), new THREE.MeshBasicMaterial({color:0x00ffff}));
            glow.position.y = 0.12;
            muzzleLight = new THREE.PointLight(0x00ffff, 0, 20);
            muzzleLight.position.z = -1;
            gun.add(body, glow, muzzleLight);
            
            gun.position.set(0.3, -0.4, -0.7);
            camera.add(gun);
            scene.add(camera);
        }

        function setupInputs() {
            // DOM Elements
            const startBtn = document.getElementById('btn-start');
            const resumeBtn = document.getElementById('btn-resume');
            const resetBtn = document.getElementById('btn-reset');
            const pauseBtn = document.getElementById('pause-btn');

            // 1. Start Game
            startBtn.addEventListener('click', () => {
                audio.init(); // Wakes up audio
                setPaused(false);
                document.getElementById('menu-start').classList.add('hidden');
                if (!isMobile) controls.lock();
            });

            // 2. Pause Logic
            pauseBtn.addEventListener('click', () => setPaused(true));
            resumeBtn.addEventListener('click', () => {
                setPaused(false);
                if (!isMobile) controls.lock();
            });

            // 3. Reset
            resetBtn.addEventListener('click', () => {
                score = 0; document.getElementById('score').innerText = "0";
                playerVelocity.set(0,0,0);
                camera.position.set(0,5,0);
                bullets.forEach(b => scene.remove(b)); bullets = [];
                enemies.forEach(e => scene.remove(e)); enemies = [];
                spawnEnemies(8);
                setPaused(false);
                if (!isMobile) controls.lock();
            });

            // 4. PC Controls
            if (!isMobile) {
                controls = new PointerLockControls(camera, document.body);
                controls.addEventListener('unlock', () => {
                    // Only pause if we didn't just click a button
                    setTimeout(() => {
                        if (document.getElementById('menu-start').classList.contains('hidden')) {
                            setPaused(true);
                        }
                    }, 100);
                });
                document.addEventListener('mousedown', () => { if (!isPaused) fire(); });
            } 
            
            // 5. Mobile Controls (Refined)
            else {
                document.getElementById('mobile-controls').style.display = 'flex';
                
                // JOYSTICK LOGIC
                const zone = document.getElementById('joystick-area');
                const nub = document.getElementById('joystick-nub');
                
                zone.addEventListener('touchmove', (e) => {
                    e.preventDefault(); // Stop scrolling
                    if(isPaused) return;

                    const touch = e.targetTouches[0];
                    const rect = zone.getBoundingClientRect();
                    const centerX = rect.left + rect.width / 2;
                    const centerY = rect.top + rect.height / 2;

                    // Calculate delta
                    let dx = touch.clientX - centerX;
                    let dy = touch.clientY - centerY;

                    // Distance cap (so nub stays inside)
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    const maxDist = 50;
                    
                    if (dist > maxDist) {
                        dx = (dx / dist) * maxDist;
                        dy = (dy / dist) * maxDist;
                    }

                    // Move Visual Nub
                    nub.style.transform = `translate(${dx}px, ${dy}px)`;

                    // Calculate Rotation Vector (With Deadzone)
                    // If moving less than 5 pixels, ignore it (prevents drift)
                    if (dist < JOYSTICK_DEADZONE) {
                        joyVector.x = 0;
                        joyVector.y = 0;
                    } else {
                        // Normalize 0 to 1
                        joyVector.x = dx / maxDist;
                        joyVector.y = dy / maxDist;
                    }

                }, { passive: false });

                zone.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    nub.style.transform = `translate(0px, 0px)`;
                    joyVector.x = 0;
                    joyVector.y = 0;
                });

                // FIRE BUTTON
                const fireBtn = document.getElementById('fire-btn-mobile');
                fireBtn.addEventListener('touchstart', (e) => {
                    e.preventDefault(); // Prevent double firing
                    if(!isPaused) fire();
                    fireBtn.style.background = '#ff0055';
                    fireBtn.style.color = '#fff';
                });
                fireBtn.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    fireBtn.style.background = 'rgba(255,0,85,0.2)';
                    fireBtn.style.color = '#ff0055';
                });
            }
        }

        function setPaused(state) {
            isPaused = state;
            const menu = document.getElementById('menu-pause');
            if (state) {
                menu.classList.remove('hidden');
                if (!isMobile) controls.unlock();
            } else {
                menu.classList.add('hidden');
            }
        }

        function fire() {
            audio.shoot();
            
            // Recoil Physics
            const dir = new THREE.Vector3();
            camera.getWorldDirection(dir);
            playerVelocity.add(dir.clone().negate().multiplyScalar(3.0));

            // Visuals
            gun.position.z = -0.6; // Kick
            muzzleLight.intensity = 8;

            // UI Kick
            const ch = document.getElementById('crosshair');
            ch.style.transform = "translate(-50%, -50%) scale(1.5)";
            setTimeout(() => ch.style.transform = "translate(-50%, -50%) scale(1)", 80);

            // Bullet Logic
            const b = new THREE.Mesh(new THREE.SphereGeometry(0.3), new THREE.MeshBasicMaterial({color:0x00ffff}));
            b.position.copy(camera.position);
            b.userData = { vel: dir.multiplyScalar(8) };
            scene.add(b);
            bullets.push(b);
        }

        function spawnEnemies(n) {
            for(let i=0; i<n; i++) {
                const e = new THREE.Mesh(new THREE.OctahedronGeometry(2), new THREE.MeshBasicMaterial({color:0xff0055, wireframe:true}));
                e.position.set((Math.random()-0.5)*350, Math.random()*40+5, (Math.random()-0.5)*350);
                scene.add(e);
                enemies.push(e);
            }
        }

        function animate() {
            requestAnimationFrame(animate);

            if (!isPaused) {
                // 1. Mobile Look Logic (Smoothed)
                if (isMobile) {
                    camera.rotation.y -= joyVector.x * JOYSTICK_SENSITIVITY;
                    camera.rotation.x -= joyVector.y * JOYSTICK_SENSITIVITY;
                    // Clamp looking up/down
                    camera.rotation.x = Math.max(-1.5, Math.min(1.5, camera.rotation.x));
                }

                // 2. Physics & Friction
                playerVelocity.multiplyScalar(0.98);
                camera.position.add(playerVelocity);

                // 3. Map Bounds (Bounce)
                const limit = 200;
                if (Math.abs(camera.position.x) > limit) {
                    camera.position.x = Math.sign(camera.position.x) * limit;
                    playerVelocity.x *= -0.7;
                    audio.wall();
                }
                if (Math.abs(camera.position.z) > limit) {
                    camera.position.z = Math.sign(camera.position.z) * limit;
                    playerVelocity.z *= -0.7;
                    audio.wall();
                }
                // Floor / Ceiling
                if (camera.position.y < 3) { camera.position.y = 3; playerVelocity.y = 0; }
                if (camera.position.y > 60) { playerVelocity.y -= 0.1; }

                // 4. Gun Return Animation
                gun.position.z += (-0.7 - gun.position.z) * 0.1;
                muzzleLight.intensity *= 0.7;
                
                // Gun Sway
                const speed = playerVelocity.length();
                gun.position.y = -0.4 + Math.sin(Date.now() * 0.01) * (speed * 0.005);
                gun.position.x = 0.3 + Math.cos(Date.now() * 0.005) * (speed * 0.005);

                // 5. Bullets & Collision
                for (let i = bullets.length - 1; i >= 0; i--) {
                    const b = bullets[i];
                    b.position.add(b.userData.vel);

                    let hit = false;
                    for (let j = enemies.length - 1; j >= 0; j--) {
                        if (b.position.distanceTo(enemies[j].position) < 4) {
                            // Boom
                            audio.hit();
                            scene.remove(enemies[j]);
                            enemies.splice(j, 1);
                            scene.remove(b);
                            bullets.splice(i, 1);
                            hit = true;
                            score += 100;
                            document.getElementById('score').innerText = score;
                            
                            // Respawn
                            if (enemies.length < 5) spawnEnemies(5);
                            break;
                        }
                    }

                    if (!hit && b.position.distanceTo(camera.position) > 400) {
                        scene.remove(b); bullets.splice(i, 1);
                    }
                }

                // Rotate Enemies
                enemies.forEach(e => { e.rotation.x += 0.01; e.rotation.y += 0.02; });

                // UI Update
                document.getElementById('speed').innerText = Math.round(playerVelocity.length() * 10);
            }

            composer.render();
        }
    </script>
</body>
</html>
