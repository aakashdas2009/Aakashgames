<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Legend Cipher Lab</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box;font-family:"Courier New",monospace}
body{
  margin:0;
  background:linear-gradient(135deg,#000,#020b10);
  color:#002222;
  overflow:hidden;
}
canvas{position:fixed;inset:0;z-index:-1}

/* ===== SCREENS ===== */
.screen{
  position:absolute;inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  padding:16px;
}
.screen.active{display:flex}

/* ===== CARDS ===== */
.card,.app{
  background:rgba(255,255,255,.94);
  border-radius:20px;
  box-shadow:0 0 35px rgba(0,255,204,.45);
  padding:22px;
  width:100%;
  max-width:420px;
}
.app{max-width:900px}

h1{text-align:center;color:#003333}

/* ===== INPUT ===== */
input,select,textarea{
  width:100%;
  margin:8px 0;
  padding:12px;
  border-radius:12px;
  border:2px solid #00cfc0;
  font-size:1rem;
}

/* ===== BUTTON ===== */
button{
  width:100%;
  margin-top:10px;
  padding:14px;
  border-radius:14px;
  border:none;
  background:linear-gradient(135deg,#00cfc0,#7fffe9);
  color:#003333;
  font-weight:bold;
  cursor:pointer;
}
button:disabled{opacity:.5}

/* ===== OUTPUT TERMINAL ===== */
.output-terminal{
  margin-top:16px;
  border-radius:16px;
  background:#f7ffff;
  box-shadow:inset 0 0 0 2px #00cfc0,0 0 20px rgba(0,255,204,.5);
  overflow:hidden;
}
.terminal-header{
  display:flex;
  gap:6px;
  padding:8px 10px;
  background:#eafffb;
  border-bottom:2px solid #00cfc0;
}
.dot{width:10px;height:10px;border-radius:50%}
.red{background:#ff6666}
.yellow{background:#ffee77}
.green{background:#55ffaa}
.title{margin-left:auto;font-size:.75rem}

.terminal-body{
  padding:18px;
  min-height:90px;
  white-space:pre-wrap;
  font-size:1rem;
}

/* ===== MISC ===== */
.loading-text{
  color:#ff5577;
  text-align:center;
  animation:blink 1s infinite;
}
@keyframes blink{50%{opacity:.4}}

.report{
  border:2px dashed #00cfc0;
  padding:14px;
  border-radius:14px;
  font-size:.9rem;
}
.greenText{color:#009977}
.yellowText{color:#aa9900}
</style>
</head>

<body>
<canvas id="matrix"></canvas>

<!-- 🎵 BACKGROUND MUSIC -->
<audio id="bgMusic" loop>
  <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_5d5e8e07a6.mp3?filename=cyber-lofi-ambient-11044.mp3" type="audio/mpeg">
</audio>

<!-- AUTH -->
<div class="screen active" id="auth">
  <div class="card">
    <h1>Secure Access</h1>
    <input id="authName" placeholder="Name">
    <input id="authAge" type="number" placeholder="Age">
    <select id="authRole">
      <option value="">Choose identity</option>
      <option>Hacker</option>
      <option>Not a Hacker</option>
    </select>
    <label><input type="checkbox" id="authTerms"> I accept Terms</label>
    <button id="authBtn">Continue</button>
  </div>
</div>

<!-- LOADING -->
<div class="screen" id="loading">
  <div class="card">
    <h1>AI Scan</h1>
    <div class="loading-text">
      PLEASE WAIT… CHECKING IF YOU ARE A COP OR CYBER SECURITY PERSON
    </div>
  </div>
</div>

<!-- REPORT -->
<div class="screen" id="report">
  <div class="card">
    <h1>Scan Result</h1>
    <div id="reportBox" class="report"></div>
    <button onclick="enterApp()">Enter Lab</button>
  </div>
</div>

<!-- APP -->
<div class="screen" id="app">
  <div class="app">
    <h1>Legend Cipher Lab</h1>

    <textarea id="input" placeholder="Type your secret message…"></textarea>

    <button onclick="encode()">Encode</button>
    <button onclick="decode()">Decode</button>

    <div class="output-terminal">
      <div class="terminal-header">
        <span class="dot red"></span>
        <span class="dot yellow"></span>
        <span class="dot green"></span>
        <span class="title">OUTPUT</span>
      </div>
      <pre id="output" class="terminal-body">⟦ Waiting for input ⟧</pre>
    </div>

    <button onclick="speak()">🔊 Cute Voice</button>
    <button onclick="copyText()">📋 Copy Output</button>
  </div>
</div>

<script>
/* ===== MUSIC (SAFE START) ===== */
const bgMusic=document.getElementById("bgMusic");
let musicStarted=false;
function startMusic(){
  if(musicStarted) return;
  musicStarted=true;
  bgMusic.volume=0;
  bgMusic.play().catch(()=>{});
  let v=0;
  const fade=setInterval(()=>{
    v+=0.02;
    bgMusic.volume=v;
    if(v>=0.25) clearInterval(fade);
  },120);
}
document.addEventListener("click",startMusic,{once:true});
document.addEventListener("keydown",startMusic,{once:true});

/* ===== SCREEN CONTROL ===== */
const screens=document.querySelectorAll(".screen");
const show=id=>{
  screens.forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
};

/* ===== LOGIN (GLITCH-FREE) ===== */
let scanning=false;
document.getElementById("authBtn").onclick=()=>{
  if(scanning) return;
  const name=document.getElementById("authName").value.trim();
  const age=parseInt(document.getElementById("authAge").value);
  const role=document.getElementById("authRole").value;
  const terms=document.getElementById("authTerms").checked;

  if(name.length<3) return alert("Name too short");
  if(!Number.isInteger(age)||age<12||age>90) return alert("Invalid age");
  if(!role) return alert("Choose identity");
  if(!terms) return alert("Accept terms");

  scanning=true;
  show("loading");

  setTimeout(()=>{
    reportBox.innerHTML=`
      Identity Check: <span class="greenText">PASS</span><br>
      Bot Probability: <span class="yellowText">LOW</span><br>
      Cop Risk: <span class="greenText">NONE</span>
    `;
    scanning=false;
    show("report");
  },2200);
};
function enterApp(){show("app");}

/* ===== CIPHER ===== */
const O=19,M=7,P=5,V="AEIOU";
function encode(){
  let r=[];
  for(const c of input.value.toUpperCase()){
    if(c>="A"&&c<="Z"){
      let p=c.charCodeAt(0)-64;
      r.push(p*M+O-(V.includes(c)?P:0));
    } else if(c===" ") r.push("/");
  }
  output.textContent="⟦ ENCODED ⟧\n\n"+r.join("-");
}
function decode(){
  let res="";
  for(const x of input.value.split("-")){
    if(x==="/"){res+=" ";continue;}
    let ok=false;
    for(let i=1;i<=26;i++){
      let c=String.fromCharCode(i+64);
      if(i*M+O-(V.includes(c)?P:0)==x){res+=c;ok=true;break;}
    }
    if(!ok) res+="?";
  }
  output.textContent="⟦ DECODED ⟧\n\n"+res;
}

/* ===== COPY (FIXED) ===== */
function copyText(){
  navigator.clipboard.writeText(
    output.textContent.replace(/⟦.*?⟧\n*/,"")
  );
  alert("Copied ✔");
}

/* ===== CUTE FEMALE VOICE ===== */
function speak(){
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(
    output.textContent.replace(/⟦.*?⟧/g,"")
  );
  const voices=speechSynthesis.getVoices();
  u.voice=voices.find(v=>/female|woman/i.test(v.name))||voices[0];
  u.pitch=1.4;
  u.rate=0.9;
  speechSynthesis.speak(u);
}

/* ===== MATRIX BACKGROUND ===== */
const c=document.getElementById("matrix"),ctx=c.getContext("2d");
let fs=16,drops=[];
function resize(){
  c.width=innerWidth;c.height=innerHeight;
  drops=Array(Math.floor(c.width/fs)).fill(1);
}
resize();addEventListener("resize",resize);
const chars="01LEGEND";
setInterval(()=>{
  ctx.fillStyle="rgba(0,0,0,.06)";
  ctx.fillRect(0,0,c.width,c.height);
  ctx.fillStyle="#00ffcc";
  ctx.font=fs+"px monospace";
  drops.forEach((y,i)=>{
    ctx.fillText(chars[Math.random()*chars.length|0],i*fs,y*fs);
    if(y*fs>c.height&&Math.random()>.97)drops[i]=0;
    drops[i]++;
  });
},45);
</script>
</body>
</html>
