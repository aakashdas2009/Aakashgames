<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>LEGEND JUMPS: AURA++ UPDATE</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<style>
    :root { 
        --primary: #00f2ff; 
        --bg-color: #020617;
        --plat-color: #1e293b;
        --glass: rgba(15, 23, 42, 0.95);
    }
    
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
    
    body {
        margin: 0; padding: 0; background: var(--bg-color); overflow: hidden;
        font-family: 'Segoe UI', system-ui, sans-serif;
        color: #fff; touch-action: none; transition: background 1s;
    }

    canvas { display: block; width: 100%; height: 100%; position: fixed; top: 0; left: 0; z-index: 0; }

    /* HINT OVERLAY */
    #hint-overlay {
        position: absolute; top: 20%; width: 100%; text-align: center;
        pointer-events: none; z-index: 50;
        opacity: 0; transform: scale(0.8); transition: 0.2s;
    }
    #hint-overlay.visible { opacity: 1; transform: scale(1); }
    
    .hint-text {
        background: rgba(0,0,0,0.9); border: 2px solid var(--primary);
        color: var(--primary); display: inline-block; padding: 20px 40px;
        border-radius: 50px; font-weight: 900; font-size: 28px;
        text-transform: uppercase; letter-spacing: 2px;
        box-shadow: 0 0 50px var(--primary);
    }

    /* UI LAYERS */
    #hud {
        position: absolute; top: 0; left: 0; width: 100%;
        padding: 20px; display: flex; justify-content: space-between;
        pointer-events: none; z-index: 10;
    }
    .hud-pill {
        background: rgba(0,0,0,0.8); border: 1px solid rgba(255,255,255,0.2);
        padding: 8px 16px; border-radius: 20px; font-weight: 800; font-size: 14px;
        color: #fff; display: flex; align-items: center; gap: 8px;
    }

    .screen {
        position: fixed; inset: 0; 
        display: none; flex-direction: column; align-items: center; justify-content: center;
        z-index: 100; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px);
    }
    .screen.active { display: flex; animation: fadeIn 0.3s ease-out; }
    @keyframes fadeIn { from { opacity:0; transform:scale(0.98); } to { opacity:1; transform:scale(1); } }

    .panel {
        background: var(--glass);
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        border-radius: 24px; padding: 30px; text-align: center;
        width: 400px; max-width: 90%;
        pointer-events: auto;
    }

    h1 { 
        margin: 0 0 10px; font-size: 2.2rem; font-weight: 900; 
        background: linear-gradient(to right, #fff, var(--primary));
        -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        text-transform: uppercase; letter-spacing: 2px;
    }
    
    .btn {
        background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
        border: 1px solid rgba(255,255,255,0.1); color: #fff;
        padding: 16px; width: 100%; border-radius: 12px;
        font-weight: 800; font-size: 15px; letter-spacing: 1px;
        cursor: pointer; text-transform: uppercase; margin-top: 12px;
        touch-action: manipulation; transition: transform 0.1s;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary { background: linear-gradient(90deg, #4f46e5 0%, #7c3aed 100%); border: none; }
    .btn-red { background: linear-gradient(90deg, #ef4444 0%, #b91c1c 100%); border: none; }

    #popup-overlay {
        position: fixed; inset: 0; background: rgba(0,0,0,0.98); z-index: 9999;
        display: none; flex-direction: column; align-items: center; justify-content: center;
    }
    #popup-overlay.visible { display: flex; animation: zoomIn 0.3s; }
    @keyframes zoomIn { from { transform:scale(0); } to { transform:scale(1); } }

    .level-list { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
    .lvl-card {
        background: rgba(255,255,255,0.05); padding: 15px; border-radius: 10px; 
        cursor: pointer; text-align: left; border: 1px solid transparent;
    }
    .lvl-card:hover { border-color: var(--primary); background: rgba(255,255,255,0.1); }

    input[type="text"] { width: 100%; background: #000; border: 1px solid #444; padding: 14px; color: #fff; border-radius: 8px; outline: none; font-weight: bold; text-transform: uppercase; }
    
    .troll-face { font-size: 100px; margin-bottom: 20px; animation: bounce 0.5s infinite; }
    @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-20px)} }
    
    .roast-msg {
        background: rgba(255,255,255,0.05); padding: 15px; border-radius: 8px;
        margin: 15px 0 25px; text-align: left; border-left: 3px solid #ff0055;
        color: #e2e8f0; font-weight: 600; line-height: 1.5;
    }
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<!-- HINT UI -->
<div id="hint-overlay">
    <div class="hint-text" id="hint-msg">! DANGER !</div>
</div>

<div id="hud">
    <div class="hud-pill">PROG: <span id="score-val" style="color:var(--primary); margin-left:5px">0%</span></div>
    <div class="hud-pill" style="border-color:gold">★ <span id="star-val" style="color:gold; margin-left:5px">0</span></div>
</div>

<!-- HOME -->
<div id="home-screen" class="screen active">
    <div class="panel">
        <h1>LEGEND JUMPS</h1>
        <div style="font-size:12px; color:#aaa; margin-bottom:25px; letter-spacing:2px;">AURA++ EDITION v12.0</div>
        <button class="btn btn-primary" id="btn-play">▶ START GAME</button>
        <button class="btn" id="btn-settings">⚙ SETTINGS</button>
        <div style="margin-top:20px; font-size:11px; color:#666;">New Legend Skin Trail!</div>
    </div>
</div>

<!-- LEVEL SELECT -->
<div id="level-screen" class="screen">
    <div class="panel">
        <h2>SELECT LEVEL</h2>
        <div class="level-list" id="level-container"></div>
        <button class="btn" id="btn-lvl-back">BACK</button>
    </div>
</div>

<!-- SETTINGS -->
<div id="settings-screen" class="screen">
    <div class="panel">
        <h2>SETTINGS</h2>
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; background:rgba(255,255,255,0.05); padding:12px; border-radius:8px;">
            <span style="font-weight:bold; font-size:14px;">SOUND EFFECTS</span>
            <input type="checkbox" checked onchange="CFG.sound=this.checked" style="width:20px; height:20px;">
        </div>
        <div style="margin-bottom:20px; text-align:left;">
            <div style="font-size:12px; color:#aaa; margin-bottom:8px; font-weight:bold;">LEGEND CODE:</div>
            <div style="display:flex; gap:8px;">
                <input type="text" id="code-input" placeholder="ENTER CODE...">
                <button class="btn-primary" style="width:auto; padding:0 20px; border-radius:8px; margin:0;" onclick="submitCode()">OK</button>
            </div>
        </div>
        <div style="display:flex; gap:10px; margin-bottom:20px;">
            <button class="btn" style="margin:0; padding:12px; font-size:12px;" onclick="setSkin('square')">■ CUBE</button>
            <button id="btn-legend-skin" class="btn btn-primary" style="margin:0; padding:12px; font-size:12px; display:none;" onclick="setSkin('legend')">★ GOD</button>
        </div>
        <div id="god-msg" style="color:#22c55e; font-size:12px; font-weight:bold; display:none; margin-bottom:15px;">● LEGEND MOD ACTIVE (STRAIGHT PATH)</div>
        <button class="btn" id="btn-set-back">BACK</button>
    </div>
</div>

<!-- RESULT -->
<div id="result-screen" class="screen">
    <div class="panel">
        <h1 id="res-title">TITLE</h1>
        <div class="roast-msg" id="res-msg">MESSAGE HERE</div>
        <div style="font-size:24px; font-weight:bold; margin-bottom:25px; color:gold;">★ <span id="res-stars">0</span></div>
        <button class="btn btn-primary" id="btn-retry">RETRY</button>
        <button class="btn" id="btn-home">MAIN MENU</button>
    </div>
</div>

<!-- TROLL POPUP -->
<div id="popup-overlay">
    <div class="troll-face">😈</div>
    <h1 style="color:#ff0055; font-size:3rem; margin:0;">HAHAHA!</h1>
    <p style="font-size:1.5rem; font-weight:bold;">TROLLED BY DEVELOPER!</p>
    <p style="color:#aaa; font-size:14px;">"Impossible means IMPOSSIBLE. You die at 99%."</p>
    <button class="btn btn-red" style="width:200px; margin-top:30px;" onclick="closePopup()">I ACCEPT DEFEAT</button>
</div>

<!-- NORMAL MSG -->
<div id="msg-overlay" style="position:fixed;inset:0;background:rgba(0,0,0,0.9);display:none;justify-content:center;align-items:center;z-index:9998;">
    <div class="panel" style="width:320px;">
        <h3 id="msg-title" style="margin-top:0;color:var(--primary)">TITLE</h3>
        <p id="msg-body">Body</p>
        <button class="btn btn-primary" onclick="closeMsg()">OK</button>
    </div>
</div>

<script>
/**
 * LEGEND JUMPS: AURA++ EDITION
 * - Legend Skin: Now an Orb with "(AURA++)" trail text
 * - Fixed Level 3 Fly Mechanic
 * - 99% Troll Logic Intact
 */

const CFG = { sound: true, skin: 'square', godMode: false, unlockedLegend: false };

// --- LEVELS CONFIG ---
const LEVELS = [
    { name: "Cyber Blue", sub: "30 Sec Run", spd: 400, len: 12000, theme: {bg:'#020617', plat:'#1e293b', neon:'#00f2ff'}, mode: 'normal' },
    { name: "Sunset Red", sub: "35 Sec Run", spd: 450, len: 15750, theme: {bg:'#2a0a0a', plat:'#451a1a', neon:'#ff4d4d'}, mode: 'normal' },
    { name: "Toxic Green", sub: "39 Sec - FLY!", spd: 500, len: 19500, theme: {bg:'#051a05', plat:'#1a331a', neon:'#33ff33'}, mode: 'fly' },
    { name: "Royal Purple", sub: "44 Sec Run", spd: 550, len: 24200, theme: {bg:'#1a051a', plat:'#331a33', neon:'#d94dff'}, mode: 'normal' },
    { name: "Golden Sands", sub: "48 Sec Run", spd: 600, len: 28800, theme: {bg:'#1a1505', plat:'#332b1a', neon:'#ffcc00'}, mode: 'normal' },
    { name: "VOID BLACK", sub: "60 Sec - IMPOSSIBLE", spd: 700, len: 42000, theme: {bg:'#000000', plat:'#111111', neon:'#ffffff'}, mode: 'normal' }
];

const GRAVITY = 2600;
const JUMP_FORCE = 920;

// --- AUDIO ---
const AudioSys = {
    ctx: null,
    init() { if(!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); },
    play(freq, type, dur) {
        if(!CFG.sound || !this.ctx) return;
        if(this.ctx.state === 'suspended') this.ctx.resume();
        const o=this.ctx.createOscillator(), g=this.ctx.createGain();
        o.type=type; o.frequency.setValueAtTime(freq, this.ctx.currentTime);
        g.gain.setValueAtTime(0.1, this.ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime+dur);
        o.connect(g); g.connect(this.ctx.destination);
        o.start(); o.stop(this.ctx.currentTime+dur);
    },
    jump() { this.play(350, 'sine', 0.1); },
    crash() { this.play(100, 'sawtooth', 0.3); },
    win() { this.play(600, 'square', 0.3); },
    laugh() { 
        this.play(150, 'sawtooth', 0.1); 
        setTimeout(()=>this.play(100, 'sawtooth', 0.1), 100);
        setTimeout(()=>this.play(150, 'sawtooth', 0.1), 200);
        setTimeout(()=>this.play(100, 'sawtooth', 0.3), 300);
    }
};

// --- ENGINE ---
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d', {alpha:false});
let W, H, loopId;
let state = { mode: 'menu', camX: 0, stars: 0, hintCooldown: 0, holding: false };
let player = { x:0, y:0, size:30, vy:0, grav: GRAVITY, jumpPower: JUMP_FORCE, grounded: false, angle: 0, trail: [] };
let input = { buffer: 0, coyote: 0 };
let objects = [];
let curLvl = 0;

function resize() { W=window.innerWidth; H=window.innerHeight; canvas.width=W; canvas.height=H; }
window.addEventListener('resize', resize);
resize();

// --- UI NAV ---
document.getElementById('btn-play').onclick = () => showScreen('level-screen');
document.getElementById('btn-settings').onclick = () => showScreen('settings-screen');
document.getElementById('btn-lvl-back').onclick = () => showScreen('home-screen');
document.getElementById('btn-set-back').onclick = () => showScreen('home-screen');
document.getElementById('btn-home').onclick = () => showScreen('home-screen');
document.getElementById('btn-retry').onclick = () => startGame();

function showScreen(id) {
    state.mode = 'menu';
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    document.getElementById('hud').style.opacity = 0;
    document.getElementById('hint-overlay').classList.remove('visible');
}

// --- LEVEL GENERATOR ---
function buildLevel(idx) {
    const data = LEVELS[idx];
    let seed = (idx+1) * 666; 
    const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
    
    // Apply Theme
    document.body.style.background = data.theme.bg;
    document.documentElement.style.setProperty('--primary', data.theme.neon);
    document.documentElement.style.setProperty('--bg-color', data.theme.bg);
    document.documentElement.style.setProperty('--plat-color', data.theme.plat);

    objects = []; state.stars = 0;
    const floorY = H * 0.75;
    const maxSafeGap = (data.spd * 0.70) * 0.85;

    // Start
    objects.push({x: -500, y: floorY, w: 2000, h: 500, type: 'floor'});

    let x = 1500;
    
    // Hints
    if(data.mode === 'fly') objects.push({x: 500, y: 0, w: 10, h: H, type: 'hint_trigger', msg: "HOLD TO FLY!"});

    // TROLL LEVEL 6
    if(idx === 5) {
        // Invisible death wall at 99% (approx 41500)
        objects.push({x: 41500, y: 0, w: 50, h: H, type: 'troll_trigger'});
    }

    while(x < data.len) {
        if(rnd() < 0.35) { // Gaps
            let gap = 150 + rnd() * (maxSafeGap - 150);
            x += gap;
            let w = 400 + rnd() * 600;
            objects.push({x: x, y: floorY, w: w, h: 500, type: 'floor'});
            
            // Spike on landing
            if(rnd() > 0.4) objects.push({x: x + 250, y: floorY-32, w:32, h:32, type:'spike'});
            x += w;
        } else { // Floor
            let w = 500 + rnd() * 500;
            objects.push({x: x, y: floorY, w: w, h: 500, type: 'floor'});

            if(data.mode === 'fly') {
                if(rnd() > 0.5) objects.push({x: x + 200, y: floorY - 200, w: 50, h: 100, type: 'spike'});
            } else {
                if(rnd() > 0.3) objects.push({x: x + 200, y: floorY-32, w:32, h:32, type:'spike'});
            }
            x += w;
        }
    }
    objects.push({x: data.len, y: 0, w: 200, h: H, type: 'win'});
}

// --- GAME LOOP ---
function loop() {
    if(state.mode !== 'play') return;
    const dt = 0.016; const data = LEVELS[curLvl];

    // Trail Update
    if(CFG.skin === 'legend') {
        // Add trail position every frame
        player.trail.push({x: player.x, y: player.y});
        if(player.trail.length > 20) player.trail.shift(); // Keep last 20 frames
    }

    if(CFG.godMode) {
        player.y = H * 0.75 - player.size;
        player.vy = 0; player.grounded = true; player.angle = 0; 
        player.x += data.spd * dt;
    } 
    else {
        if(data.mode === 'fly') {
            if(state.holding) { player.vy -= 4000 * dt; if(player.vy < -500) player.vy = -500; } 
            else { player.vy += 2000 * dt; }
            player.grounded = false;
        } 
        else {
            if(input.buffer > 0) input.buffer -= dt;
            if(player.grounded) input.coyote = 0.1; else if(input.coyote>0) input.coyote -= dt;
            if(input.buffer > 0 && (player.grounded || input.coyote > 0)) {
                player.vy = -player.jumpPower; player.grounded = false;
                input.buffer=0; input.coyote=0; AudioSys.jump();
            }
            player.vy += player.grav * dt;
        }
        player.x += data.spd * dt;
        player.y += player.vy * dt;
        if(!player.grounded) player.angle += 9*dt;
        else { let t = Math.round(player.angle/(Math.PI/2))*(Math.PI/2); player.angle+=(t-player.angle)*15*dt; }
    }

    state.camX = player.x - W * 0.25;

    if(player.y > H + 100 && !CFG.godMode) crash();
    if(player.y < -100 && data.mode === 'fly' && !CFG.godMode) crash();

    if(!CFG.godMode) player.grounded = false;
    
    let hit = {x:player.x+8, y:player.y+8, w:14, h:14};
    if(state.hintCooldown > 0) state.hintCooldown -= dt;

    for(let o of objects) {
        if(o.x > player.x + W || o.x + o.w < player.x - W) continue;
        
        if(rectIntersect(hit, o)) {
            if(o.type === 'win') win();
            else if(o.type === 'spike') { if(!CFG.godMode) crash(); }
            else if(o.type === 'hint_trigger') { showHint(o.msg); }
            else if(o.type === 'troll_trigger' && !CFG.godMode) { triggerTroll(); }
            else if(o.type === 'floor' && !CFG.godMode) {
                if(player.vy > 0 && player.y + player.size < o.y + 25) {
                    player.y = o.y - player.size; player.vy = 0; player.grounded = true;
                }
            }
        }
    }
    draw(); loopId = requestAnimationFrame(loop);
}

function triggerTroll() {
    state.mode = 'dead';
    AudioSys.laugh();
    document.getElementById('popup-overlay').classList.add('visible');
}

function showHint(text) {
    if(state.hintCooldown > 0) return;
    const h = document.getElementById('hint-overlay');
    document.getElementById('hint-msg').innerText = text;
    h.classList.add('visible');
    state.hintCooldown = 5; 
    setTimeout(() => { h.classList.remove('visible'); }, 3000);
}

function draw() {
    const theme = LEVELS[curLvl].theme;
    ctx.fillStyle = theme.bg; ctx.fillRect(0,0,W,H);
    ctx.strokeStyle = "rgba(255,255,255,0.05)"; ctx.beginPath();
    let ox = state.camX % 100; for(let i=0; i<W; i+=100) { ctx.moveTo(i-ox, 0); ctx.lineTo(i-ox, H); } ctx.stroke();
    
    ctx.save(); ctx.translate(-state.camX, 0);

    // Draw Objects
    for(let o of objects) {
        if(o.x > state.camX+W || o.x+o.w < state.camX) continue;
        if(o.type === 'floor') {
            ctx.fillStyle = theme.plat; ctx.fillRect(o.x, o.y, o.w, o.h);
            ctx.fillStyle = theme.neon; ctx.fillRect(o.x, o.y, o.w, 4);
        } else if(o.type === 'spike') {
            ctx.fillStyle = "#ff0055"; ctx.beginPath(); ctx.moveTo(o.x,o.y+o.h); ctx.lineTo(o.x+o.w/2,o.y); ctx.lineTo(o.x+o.w,o.y+o.h); ctx.fill();
        } else if(o.type === 'win') {
            ctx.fillStyle = "#00ff88"; ctx.fillRect(o.x,o.y,o.w,o.h);
        }
    }

    // Draw Legend Trail
    if(CFG.skin === 'legend') {
        ctx.font = "bold 12px monospace";
        ctx.textAlign = "center";
        // Draw old positions
        for(let i=0; i<player.trail.length; i++) {
            let pos = player.trail[i];
            let alpha = i / player.trail.length; // Fade out based on index
            ctx.fillStyle = `rgba(0, 242, 255, ${alpha})`;
            ctx.shadowBlur = 0;
            ctx.fillText("(AURA++)", pos.x + 15, pos.y + 10);
        }
    }

    // Draw Player
    ctx.translate(player.x+15, player.y+15); ctx.rotate(player.angle);
    if(CFG.skin==='legend') { 
        // Orb Shape
        ctx.shadowColor = "#00f2ff"; ctx.shadowBlur = 20;
        ctx.fillStyle="#fff"; 
        ctx.beginPath(); ctx.arc(0,0,15,0,Math.PI*2); ctx.fill();
    } 
    else { 
        // Square
        ctx.shadowBlur = 0;
        ctx.fillStyle=theme.neon; ctx.fillRect(-15,-15,30,30); 
    }
    ctx.restore();

    document.getElementById('score-val').innerText = Math.floor((player.x / LEVELS[curLvl].len)*100)+"%";
    document.getElementById('star-val').innerText = state.stars;
}

function crash() { state.mode='dead'; AudioSys.crash(); showResult(false); }
function win() { state.mode='dead'; AudioSys.win(); showResult(true); }

function showResult(isWin) {
    showScreen('result-screen');
    const tit = document.getElementById('res-title');
    const msg = document.getElementById('res-msg');
    document.getElementById('res-stars').innerText = state.stars;

    if(isWin) {
        tit.innerText = "WAAHH BETE!"; tit.style.color = "#00ff88";
        msg.innerText = "WAA BHAI TUUKE ME JEET GAYA AAB DAAM HETO DUSRA KHELKE DIKHA";
        document.getElementById('btn-retry').innerText = "NEXT LEVEL >>";
        document.getElementById('btn-retry').onclick = () => { curLvl++; if(curLvl>=LEVELS.length) curLvl=0; startGame(); };
    } else {
        tit.innerText = "KHATAM TATA BYE BYE"; tit.style.color = "#ff0055";
        msg.innerText = "KYA GUNDA BANEGA RE TU? DANG SE KHEL!";
        document.getElementById('btn-retry').innerText = "TRY AGAIN";
        document.getElementById('btn-retry').onclick = () => startGame();
    }
}

function closePopup() { 
    document.getElementById('popup-overlay').classList.remove('visible'); 
    showResult(false); 
}

function showMsg(t, m) {
    document.getElementById('msg-title').innerText = t;
    document.getElementById('msg-body').innerText = m;
    document.getElementById('msg-overlay').style.display='flex';
}
function closeMsg() { document.getElementById('msg-overlay').style.display='none'; }

function submitCode() {
    const v = document.getElementById('code-input').value.toUpperCase().trim();
    if(v === 'LEGEND SKIN') {
        CFG.unlockedLegend = true; document.getElementById('btn-legend-skin').style.display = 'block';
        showMsg("OHO LEGEND!", "WAAHH CODE SE NEW SKIN LE RAHA HE WOO BHI AURA SKIN!!!");
    } else if(v === 'LEGEND MOD') {
        CFG.godMode = true; document.getElementById('god-msg').style.display = 'block';
        showMsg("HACKER BOLTE!", "WAAHH! AAB FREE FIRE METO HACK USE NAHI KARPAYA TO IS GAME ME USE KARAHA HE?");
    } else {
        showMsg("ABEY SAALE!", "OOYE KON HE BAY TU CHODUU?? GALAT CODE DETA HE GAME KE DEVELOPER SE CODE MAANG NOOBDE!!");
    }
}

function setSkin(s) { CFG.skin = s; }

function startGame() {
    AudioSys.init();
    player.x=0; player.y=H*0.75-50; player.vy=0; player.grounded=true; player.angle=0; player.trail=[];
    state.mode='play'; state.camX=0; input.buffer=0; state.hintCooldown=0; state.holding=false;
    
    buildLevel(curLvl);
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('hud').style.opacity = 1;
    loopId = requestAnimationFrame(loop);
}

function selectLevel(i) { curLvl=i; startGame(); }

const list = document.getElementById('level-container');
LEVELS.forEach((l,i)=>{
    let d = document.createElement('div'); d.className='lvl-card';
    d.innerHTML=`<div class="lvl-name">${i+1}. ${l.name}</div><div style="font-size:10px;color:#aaa">${l.sub}</div>`;
    d.onclick = () => selectLevel(i);
    list.appendChild(d);
});

const handleStart = (e) => { e.preventDefault(); if(state.mode==='play') { state.holding = true; input.buffer=0.15; } };
const handleEnd = (e) => { e.preventDefault(); state.holding = false; };
canvas.addEventListener('pointerdown', handleStart, {passive:false});
canvas.addEventListener('pointerup', handleEnd, {passive:false});
canvas.addEventListener('pointerleave', handleEnd, {passive:false});
window.addEventListener('keydown', (e)=>{ if((e.code==='Space'||e.code==='ArrowUp') && state.mode==='play') { state.holding=true; input.buffer=0.15; } });
window.addEventListener('keyup', (e)=>{ if(e.code==='Space'||e.code==='ArrowUp') state.holding=false; });

function rectIntersect(r1, r2) { return !(r2.x > r1.x+r1.w || r2.x+r2.w < r1.x || r2.y > r1.y+r1.h || r2.y+r2.h < r1.y); }

</script>
</body>
